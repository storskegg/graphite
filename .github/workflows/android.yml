name: Android

on:
  push:
  pull_request:
  # The emulator test runs only on request until it has proven itself on hosted runners.
  workflow_dispatch:
    inputs:
      emulators:
        description: Also run android/emulator-test.sh on two emulators
        type: boolean
        default: true

jobs:
  unit:
    name: app unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-ffi
      - name: Android SDK packages and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "ndk;30.0.16248370" >/dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Unit tests and the debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

  emulators:
    name: emulator test (two AVDs over TCP)
    if: github.event_name == 'workflow_dispatch' && inputs.emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-ffi
      - name: KVM for the emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK packages, system images and cargo-ndk
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null
          "$sdk" "platforms;android-37" "ndk;30.0.16248370" emulator platform-tools \
            "system-images;android-37.0;google_apis;x86_64" "system-images;android-30;google_apis;x86_64" >/dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: android/emulator-test.sh
        run: android/emulator-test.sh
