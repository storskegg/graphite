name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [core, strip, core-ffi]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Reference tools for the stripper's tests
        if: matrix.crate == 'strip'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg libheif-examples
          exiftool -ver
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
