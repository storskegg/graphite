[package]
name = "graphite-strip"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "graphite's metadata stripper: lossless, deterministic removal of location, identifiers and dates from photos and videos"
repository = "https://github.com/storskegg/graphite"
publish = false

[dependencies]
crc32fast = "1.5.4"
md-5 = "0.11.0"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde_json = "1.0"
